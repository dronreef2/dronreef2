name: WakaTime Stats

on:
  schedule:
    # Runs every day at 7 AM UTC
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  update-readme:
    name: Update README with WakaTime Stats
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      
      - name: Update WakaTime Stats
        uses: anmol098/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHOW_TITLE: true
          SHOW_TOTAL_CODE_TIME: true
          SHOW_PROFILE_VIEWS: false
          SHOW_COMMIT: true
          SHOW_DAYS_OF_WEEK: true
          SHOW_LANGUAGE: true
          SHOW_OS: true
          SHOW_PROJECTS: true
          SHOW_TIMEZONE: true
          SHOW_EDITORS: true
          SHOW_LANGUAGE_PER_REPO: true
          SHOW_SHORT_INFO: true
          SHOW_LOC_CHART: false

# NOTE: To use this workflow:
# 1. Get your WakaTime API key from https://wakatime.com/settings/account
# 2. Add it as a repository secret named WAKATIME_API_KEY
# 3. Ensure the README.md contains the following comment markers:
#    <!--START_SECTION:waka-->
#    <!--END_SECTION:waka-->
# 4. The workflow will automatically update the content between these markers
